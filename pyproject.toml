[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "theoria"
version = "0.1.0"
description = "Offline math & science reasoning assistant for ADTC 2026"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "sympy>=1.14",
  "numpy>=1.25",
  "scipy>=1.10",
  "sentence-transformers>=2.2.0",
  "huggingface-hub>=0.26.0",
]

[project.scripts]
theoria = "theoria.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["theoria*"]
