<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Theoria — Solve. Verify. Explain.</title>
  <link rel="icon" type="image/png" href="/static/favicon.png" />
  <link rel="apple-touch-icon" href="/static/brand/theoria-logo.png" />
  <link rel="stylesheet" href="/static/vendor/katex/katex.min.css" />
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="app">

    <aside class="sidebar">
      <div class="brand">
        <img class="brand-logo" src="/static/brand/theoria-logo.png" alt="Theoria" width="120" height="40" />
      </div>

      <button id="new-chat" class="new-chat-btn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        New chat
      </button>

      <div class="side-label">History</div>
      <nav id="chat-list" class="chat-list"></nav>

      <div class="side-label">Documents</div>
      <label class="doc-upload" for="pdf-input">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
        Attach a PDF
        <input type="file" id="pdf-input" accept="application/pdf" hidden />
      </label>
      <ul id="doc-list" class="doc-list"></ul>

      <div class="side-footer">
        <div class="status-row"><span class="dot" id="health-dot"></span><span id="health-text">Checking…</span></div>
        <div class="status-row muted" id="perf-text"></div>
      </div>
    </aside>

    <main class="main empty" id="main">
      <div id="hero" class="hero">
        <img class="hero-logo" src="/static/brand/theoria-logo.png" alt="Theoria" width="112" height="112" />
        <h1>Solve. Verify. Explain.</h1>
        <p class="hero-sub">Offline mathematical intelligence for the laptop you already own.</p>
      </div>

      <div id="chat" class="chat"></div>

      <div class="composer-wrap" id="composer-wrap">
        <div id="attach-row" class="attach-row"></div>
        <form id="ask-form" class="composer">
          <textarea id="query" rows="1" placeholder="Ask Theoria" autocomplete="off"></textarea>
          <div class="composer-bar">
            <div class="bar-left">
              <label for="photo-input" class="tool-btn" id="photo-btn" title="Attach a photo of a problem">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
                <input type="file" id="photo-input" accept="image/*" capture="environment" hidden />
              </label>
              <button type="button" id="think-btn" class="tool-btn pill" title="Extended reasoning (slower, deeper)">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a7 7 0 0 1 7 7c0 2.4-1.2 4.4-3 5.7V17a2 2 0 0 1-2 2h-4a2 2 0 0 1-2-2v-2.3C6.2 13.4 5 11.4 5 9a7 7 0 0 1 7-7z"/><path d="M9 21h6"/></svg>
                Think
              </button>
            </div>
            <button type="button" id="stop-btn" class="stop-btn hidden" title="Stop generating">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="1"/></svg>
            </button>
            <button type="submit" id="ask-btn" class="send-btn" title="Send">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
            </button>
          </div>
        </form>

        <div id="suggestions" class="suggestions">
          <button class="chip" data-q="Solve x^2 - 5x + 6 = 0 and explain each step">Solve a quadratic step by step</button>
          <button class="chip" data-q="Prove or disprove: for all integers n, n^2 > n">Prove or disprove a claim</button>
          <button class="chip" data-q="Fill the sorry in this Lean 4 theorem:&#10;```lean&#10;theorem two_mul (n : Nat) : 2 * n = n + n := by sorry&#10;```">Fill sorries in a Lean proof</button>
          <button class="chip" data-q="Generate a LaTeX document deriving the quadratic formula by completing the square">Generate a LaTeX document</button>
          <button class="chip" data-q="Why does ice float on water?">Why does ice float on water?</button>
        </div>
      </div>
    </main>

    <div id="preview-resizer" class="preview-resizer hidden" title="Drag to resize preview" aria-hidden="true"></div>
    <aside id="preview-panel" class="preview-panel hidden">
      <div class="preview-head">
        <span class="side-label" style="margin:0">Document preview</span>
        <div class="preview-actions">
          <div class="preview-zoom" title="Preview text size">
            <button type="button" id="preview-zoom-out" class="ghost-btn zoom-btn" aria-label="Smaller">A−</button>
            <button type="button" id="preview-zoom-in" class="ghost-btn zoom-btn" aria-label="Larger">A+</button>
          </div>
          <button id="download-tex" class="ghost-btn">Download .tex</button>
          <button id="save-pdf" class="ghost-btn" title="Downloads a print-ready HTML — open in Chrome/Safari and Print → Save as PDF">Download HTML</button>
          <button id="close-preview" class="ghost-btn" title="Close">&#10005;</button>
        </div>
      </div>
      <div id="preview-body" class="preview-body"></div>
    </aside>

  </div>

  <script src="/static/vendor/katex/katex.min.js"></script>
  <script src="/static/vendor/katex/auto-render.min.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
